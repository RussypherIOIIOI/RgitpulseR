[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "0.1.0"
description = "One repository. Explainable metrics. Repeatable imports."
requires-python = ">=3.12"
dependencies = ["asyncpg==0.31.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.6", "playwright==1.58.0"]

[project.scripts]
gitpulse = "gitpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitpulse = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a dedicated PostgreSQL database", "browser: requires the running Next.js application"]

[tool.ruff]
line-length = 100
target-version = "py312"
